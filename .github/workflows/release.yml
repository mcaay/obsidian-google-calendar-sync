name: Release

# Pushing a version tag such as 0.9.2 builds the plugin here, attests the
# release files so anyone can verify they were built from this repository,
# and publishes them. The annotated tag message becomes the release notes.
on:
    push:
        tags:
            - '[0-9]+.[0-9]+.[0-9]+'

permissions:
    contents: read

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # Checkout stores the tag without its message; fetch the tag object.
            - run: git fetch --force --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: lts/*
                  cache: npm
            - run: npm ci
            - run: npm test
            - run: npm run build
            - name: Check that the tag matches manifest.json
              run: test "$(node -p "require('./manifest.json').version")" = "$GITHUB_REF_NAME"
            - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css
            # Obsidian downloads only these three files; anything else is flagged.
            - name: Publish the release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "v$GITHUB_REF_NAME" --notes-from-tag --verify-tag
